[package]
name = "rmpc-theme-gen"
version = "0.1.0"
edition = "2021"

[dependencies]
color-core = { path = "vendor/color-core" }
ron = "0.12"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
serde_json = "1"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
libc = "0.2"

[build-dependencies]
sha2 = "0.10"

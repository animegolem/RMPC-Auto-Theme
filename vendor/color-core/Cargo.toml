[package]
name = "color-core"
version = "0.1.0"
edition = "2021"
authors = ["color-tool"]
description = "Tauri-free color analysis engine: OKLab/OKLch conversions, k-means++ clustering, image sampling, and cluster merging"
license = "MIT"

[features]
default = ["simd"]
simd = ["dep:wide"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
rand = { version = "0.8", features = ["small_rng"] }
rayon = "1.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
wide = { version = "0.7", optional = true, default-features = false, features = ["std"] }

[dev-dependencies]
proptest = "1.4"
serde_json = "1.0"
tempfile = "3.10"
